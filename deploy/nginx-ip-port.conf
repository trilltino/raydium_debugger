# Optional host-nginx proxy for an IP-only deployment on port 8788.
# Use this instead of publishing the container directly if you want rate limits,
# headers, and a single place to manage public ports.
#
# docker-compose.ip.yml port mapping should become:
#   "127.0.0.1:8787:8787"

server {
    listen 8788;
    listen [::]:8788;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
