[advisories]
version = 2
ignore = [
    # Transitive through Solana 3.x; no direct safe replacement is available in this app today.
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
