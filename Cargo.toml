[package]
name = "raydium_debugger"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
authors = ["trilltino"]
license = "AGPL-3.0-or-later"
publish = false
description = "Standalone Solana/Raydium transaction debugger extracted from XFChess"
exclude = [
    ".env",
    ".env.*",
    ".github/",
    ".kilo/",
    ".raydium-debugger/",
    "target/",
    "web/node_modules/",
    "web/dist/",
    "web/playwright-report/",
    "web/test-results/",
    "*.log",
]

[workspace]
resolver = "2"
members = [".", "server", "src-tauri", "xtask"]

[features]
default = []
ai = ["dep:genai"]

[lib]
name = "raydium_debugger"
path = "src/lib.rs"

[[bin]]
name = "raydium-debugger"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.103"
bs58 = "=0.5.1"
chrono = { version = "=0.4.44", features = ["serde"] }
clap = { version = "=4.5", features = ["derive", "env"] }
dotenvy = "=0.15.7"
flate2 = "=1.1.5"
genai = { version = "=0.7.0-beta.24", optional = true }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
solana-client = "=3.1.12"
solana-commitment-config = "=3"
solana-sdk = "=3.0.0"
solana-transaction-status = "=3.1.12"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
url = "=2.5.8"
toml = "=0.9.8"

[dev-dependencies]
insta = { version = "=1.43.2", default-features = false }
