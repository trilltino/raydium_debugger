[package]
name = "raydium-debugger-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
publish = false

[features]
default = []
ai = ["raydium_debugger/ai"]

[dependencies]
raydium-investigation = { path = "../crates/raydium-investigation" }
anyhow = "=1.0.103"
axum = "=0.7.9"
clap = { version = "=4.5", features = ["derive"] }
dotenvy = "=0.15.7"
futures-util = "=0.3.34"
raydium_debugger = { path = ".." }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
solana-sdk = "=3.0.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.6.11", features = ["cors", "fs"] }
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
