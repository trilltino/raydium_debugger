name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --workspace --all-targets --locked
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Raydium registry validate
        run: cargo run -p xtask -- raydium-registry validate
      - name: Raydium instruction registry validate
        run: cargo run -p xtask -- raydium-instructions validate
      - name: Rust docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Runtime dependency isolation
        run: py -3 scripts/check-runtime-boundaries.py
      - name: Dependency policy
        run: cargo deny check
      - name: Frontend install
        run: npm --prefix web ci
      - name: Frontend audit
        run: npm --prefix web audit --omit=dev
      - name: Frontend typecheck
        run: npm --prefix web run typecheck
      - name: Frontend build
        run: npm --prefix web run build
      - name: Install E2E browsers
        working-directory: web
        run: npx playwright install chromium webkit
      - name: Browser smoke tests
        run: npm --prefix web run test:e2e

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Build embedded frontend
        run: npm --prefix web run build
      - name: Build actual desktop application and operator adapter
        run: cargo build -p raydium-debugger-tauri --features custom-protocol -p xtask --locked
      - name: Install native Tauri driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install matching Edge driver
        run: ./scripts/install-edge-driver.ps1
      - name: Native Windows IPC and restart verification
        run: npm --prefix web run test:native
