[package]
name = "raydium-debugger-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
publish = false

[lib]
name = "raydium_debugger_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raydium_debugger = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
ai = ["raydium_debugger/ai"]
