[package]
name = "raydium-debugger-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
publish = false

[lib]
name = "raydium_debugger_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raydium_debugger = { path = ".." }
raydium-investigation = { path = "../crates/raydium-investigation" }
dotenvy = "=0.15.7"
uuid = { version = "=1.26.1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
ai = ["raydium_debugger/ai"]
