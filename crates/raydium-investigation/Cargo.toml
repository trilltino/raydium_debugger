[package]
name = "raydium-investigation"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
license = "AGPL-3.0-or-later"
publish = false


[dependencies]
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
raydium_debugger = { path = "../.." }
raydium-knowledge = { path = "../raydium-knowledge" }
raydium-observability = { path = "../raydium-observability" }
solana-sdk = "=3.0.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }
tracing = "=0.1.44"

tracing-subscriber = { version = "0.3", features = ["fmt"] }
