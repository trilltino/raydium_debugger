[package]
name = "raydium-knowledge-builder"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
license = "AGPL-3.0-or-later"
publish = false


[dependencies]
anyhow = "=1.0.103"
bs58 = "=0.5.1"
chrono = { version = "=0.4.44", features = ["serde"] }
petgraph = "=0.8.3"
raydium_debugger = { path = "../.." }
raydium-knowledge = { path = "../raydium-knowledge" }
raydium-observability = { path = "../raydium-observability", features = ["collection"] }
reqwest = { version = "=0.12.28", features = ["blocking", "json", "rustls-tls"], default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
scraper = "=0.24.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tantivy = "=0.22.1"

